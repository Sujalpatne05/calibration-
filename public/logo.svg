<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sanc-gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="55%" stop-color="#0052a3" />
      <stop offset="100%" stop-color="#003d7a" />
    </linearGradient>
    <radialGradient id="sanc-dial" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </radialGradient>
  </defs>

  <!-- Gear body - blue circle -->
  <circle cx="100" cy="100" r="90" fill="url(#sanc-gear)" />
  
  <!-- Inner white circle -->
  <circle cx="100" cy="100" r="75" fill="url(#sanc-dial)" />
  <circle cx="100" cy="100" r="75" fill="none" stroke="#ffffff" stroke-width="4" />

  <!-- Dial tick marks (top arc) -->
  <g stroke="#0066cc" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="30" x2="100" y2="40" />
    <line x1="125" y1="33" x2="120" y2="44" />
    <line x1="145" y1="45" x2="137" y2="54" />
    <line x1="158" y1="63" x2="148" y2="68" />
    <line x1="167" y1="85" x2="156" y2="85" />
  </g>

  <!-- Red SANC banner -->
  <rect x="40" y="90" width="120" height="32" rx="4" fill="#e11d2a" />
  <text x="100" y="112" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="2" fill="#ffffff">
    SANC
  </text>

  <!-- Dark blue bottom section for scale marks -->
  <path d="M 45 120 Q 100 135 155 120 L 155 140 Q 100 150 45 140 Z" fill="#003d7a" />
  
  <!-- Scale marks on bottom section -->
  <g stroke="#ffffff" stroke-width="1.5">
    <line x1="50" y1="128" x2="50" y2="134" />
    <line x1="62" y1="128" x2="62" y2="134" />
    <line x1="74" y1="128" x2="74" y2="134" />
    <line x1="86" y1="128" x2="86" y2="134" />
    <line x1="100" y1="128" x2="100" y2="134" />
    <line x1="114" y1="128" x2="114" y2="134" />
    <line x1="126" y1="128" x2="126" y2="134" />
    <line x1="138" y1="128" x2="138" y2="134" />
    <line x1="150" y1="128" x2="150" y2="134" />
  </g>

  <!-- Needle + hub -->
  <line x1="100" y1="100" x2="135" y2="65" stroke="#0066cc" stroke-width="3" stroke-linecap="round" />
  <circle cx="100" cy="100" r="7" fill="#0066cc" />
  <circle cx="100" cy="100" r="4" fill="#ffffff" />

  <!-- Registered mark -->
  <text x="175" y="28" font-family="Poppins, sans-serif" font-size="14" font-weight="bold" fill="#666666">®</text>
</svg>
